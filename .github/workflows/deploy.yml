name: Deploy to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  ftp-deploy:
    name: Deploy Website via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Test FTP Connection
        run: |
          timeout 10 bash -c '</dev/tcp/109.106.250.188/21' && echo "FTP port is reachable" || echo "FTP port is NOT reachable"

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 109.106.250.188
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          # loganoscher.com's web root inside the Hostinger account (the account-level
          # /public_html/ is a different folder that the site doesn't serve).
          server-dir: /domains/loganoscher.com/public_html/
          # No clean slate: only new or changed files are uploaded and nothing on the
          # server is wiped first.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            README.md
